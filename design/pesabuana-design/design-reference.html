<body>
<div id="pb">
 <div class="demo-toolbar" id="demo-toolbar"><strong>Design reference · sample data, not your records</strong><div class="demo-tools"><label><input type="checkbox" id="empty-toggle"> Empty account</label><label>Accent <select id="accent-picker" aria-label="Preview accent colour"><option value="vermilion">Vermilion</option><option value="blue">Cobalt</option></select></label></div></div>
 <header class="topbar"><div class="wordmark">pesabuana</div><nav class="navigation" aria-label="Main navigation"><button data-page="overview" aria-current="page">Overview</button><button data-page="entries">Entries</button><button data-page="targets">Targets</button><button data-page="settings">Settings</button></nav><span class="local-note"><span class="local-dot" aria-hidden="true"></span>Stored on this computer</span></header>
 <main id="main"></main>
 <dialog id="entry-dialog" aria-labelledby="entry-heading"></dialog>
 <dialog id="details-dialog" aria-labelledby="details-heading"></dialog>
 <div class="toast" id="toast" role="status" hidden></div>
</div>
<script>
(()=>{
const root=document.getElementById('pb'),main=root.querySelector('main');
const params=new URLSearchParams(location.search);
let page=params.get('page')||'overview',empty=params.get('empty')==='1',kind='sale',entryFilter='all',toastTimer;
const formatter=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const f=n=>formatter.format(n),rmb=n=>'￥'+f(n);
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rates=params.get('rates')==='unset'?{USD:null,KSh:null}:{USD:.15,KSh:19.45};
let fixtures=[
 {date:'2026-11-12',description:'Homeware order',type:'sale',amount:12800,cost:4200},
 {date:'2026-11-11',description:'Local delivery',type:'expense',amount:450,cost:0},
 {date:'2026-11-11',description:'Accessories order',type:'sale',amount:8500,cost:2750},
 {date:'2026-11-10',description:'Supplier samples',type:'expense',amount:680,cost:0},
 {date:'2026-11-09',description:'Office equipment order',type:'sale',amount:14500,cost:5250},
 {date:'2026-11-08',description:'Earlier sales in this period',type:'sale',amount:89000,cost:30200},
 {date:'2026-11-08',description:'Earlier business expenses in this period',type:'expense',amount:17020,cost:0}
];
const totals=()=>{let s=0,c=0,e=0;for(const row of(empty?[]:fixtures)){if(row.type==='sale'){s+=row.amount;c+=row.cost}else e+=row.amount}return{sales:s,costs:c,gross:s-c,expenses:e,net:s-c-e}};
const targetInfo=[{id:'birthday',name:'Operation Birthday Gift',amount:100000,day:'04',deadline:'4 Dec 2026',days:23,emptyDays:44,estimate:128500},{id:'newyear',name:'Operation New Year',amount:150000,day:'31',deadline:'31 Dec 2026',days:50,emptyDays:71,estimate:207352.27}];
function eq(n,compact=false){if(!rates.USD&&!rates.KSh)return `<div class="${compact?'goal-equivalents':'equivalents'}"><button type="button" class="rate-setup" data-note="rates">Set exchange rates</button><span>USD · KSh</span></div>`;return `<div class="${compact?'goal-equivalents':'equivalents'}">${rates.USD?`<span>≈ USD ${f(n*rates.USD)}</span>`:'<button type="button" class="rate-setup" data-note="rates">USD · Set exchange rates</button>'}${rates.KSh?`<span>≈ KSh ${f(n*rates.KSh)}</span>`:'<button type="button" class="rate-setup" data-note="rates">KSh · Set exchange rates</button>'}${compact?'':'<button class="equivalent-note" data-note="rates">Saved rates</button>'}</div>`}
function pageHeading(title,subtitle,actions){return `<div class="page-heading"><div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${actions||''}</div></div>`}
const entryActions=()=>'<button class="button" data-entry="expense">Add expense</button><button class="button primary" data-entry="sale"><span class="plus" aria-hidden="true">+</span>Add sale</button>';
function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function goal(g,expanded=false){const t=totals(),net=t.net,percent=net/g.amount*100,days=empty?g.emptyDays:g.days,remaining=Math.max(g.amount-net,0);return `<article class="goal" aria-label="${g.name}"><div class="goal-top"><div class="date-tile" aria-label="${g.deadline}"><span class="month">DEC</span><span class="day">${g.day}</span></div><div><h3>${g.name}</h3><div class="goal-kind">Net profit target · 2026</div></div></div><div class="goal-amount mono-num">${rmb(g.amount)}<small>target</small></div>${eq(g.amount,true)}<div class="goal-progress-meta"><span>${rmb(net)} earned</span><strong>${percent.toFixed(2)}%</strong></div><div class="progress-track" role="progressbar" aria-label="${g.name} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.max(0,Math.min(100,percent))}"><span style="width:${Math.max(0,Math.min(100,percent))}%"></span></div><div class="goal-footer"><div>Remaining<strong>${rmb(remaining)}</strong></div><div>Needed per day<strong>${rmb(remaining/days)}</strong></div></div>${expanded?`<div class="goal-extra"><div>Days left<strong>${days}</strong></div><div>Estimate at deadline<strong>${rmb(empty?0:net/22*(g.id==='birthday'?44:71))}</strong></div></div><div class="target-period">22 Oct 2026 – ${g.deadline} · Days left includes today.</div><div class="goal-actions"><button class="link" data-edit-target="${g.id}">Edit target ↗</button><button class="link danger-link" data-delete-target="${g.id}">Delete target</button></div>`:`<button class="goal-more" data-goal="${g.id}"><span>${days} days left · Includes today</span><span>Details ↗</span></button>`}</article>`}
function rows(limit=99){return (empty?[]:fixtures).filter(r=>entryFilter==='all'||r.type===entryFilter).slice(0,limit).map((r,i)=>`<tr><td class="entry-date">${dateLabel(r.date)}</td><td class="entry-description">${escapeHtml(r.description)}</td><td><span class="entry-type ${r.type==='expense'?'expense':''}">${r.type==='sale'?'Sale':'Expense'}</span></td><td class="num">${rmb(r.amount)}</td><td class="num">${r.type==='sale'?rmb(r.cost):'—'}</td><td class="num">${r.type==='sale'?rmb(r.amount-r.cost):'−'+rmb(r.amount)}</td>${page==='entries'?`<td class="num"><button class="row-action" data-edit-entry="${fixtures.indexOf(r)}" aria-label="Edit ${escapeHtml(r.description)}">Edit</button></td>`:''}</tr>`).join('')}
function table(limit){return `<div class="table-surface"><table><thead><tr><th>Date</th><th>Description</th><th>Type</th><th class="num">Amount (RMB)</th><th class="num">Direct cost</th><th class="num">Profit impact</th>${page==='entries'?'<th class="num">Action</th>':''}</tr></thead><tbody>${rows(limit)}</tbody></table>${empty?'<div class="table-empty">No entries yet. Your saved sales and expenses will appear here.</div>':''}</div>`}
function overview(){const t=totals();return pageHeading('Overview',empty?'1–31 October 2026 · This month':'22 Oct – 12 Nov 2026 · Custom period',entryActions())+`<div class="overview-grid"><section class="profit-panel" aria-label="Profit summary"><div class="profit-header"><span class="eyebrow">Net profit</span><div class="period-controls" aria-label="Period preview">${['Today','This week','This month','Custom'].map(v=>`<button aria-pressed="${v===(empty?'This month':'Custom')}" data-period="${v}">${v}</button>`).join('')}</div></div><div class="profit-figure"><div class="hero-number"><span class="currency">￥</span>${f(t.net)}</div>${eq(t.net)}</div><div class="metric-strip">${[['Sales','sales'],['Direct costs','costs'],['Gross profit','gross'],['Other expenses','expenses']].map(([label,key])=>`<div><div class="metric-label">${label}</div><div class="metric-value">${rmb(t[key])}</div><div class="metric-conversion">${!rates.USD&&!rates.KSh?'Set exchange rates<br>USD · KSh':(rates.USD?'≈ USD '+f(t[key]*rates.USD):'USD · Set exchange rates')+'<br>'+(rates.KSh?'≈ KSh '+f(t[key]*rates.KSh):'KSh · Set exchange rates')}</div></div>`).join('')}</div><div class="chart-block"><div class="chart-header"><h2 class="section-title">Profit over time</h2><div class="legend"><span><i class="swatch gross"></i>Gross profit</span><span><i class="swatch"></i>Net profit</span></div></div><div class="chart-wrap"><svg id="profit-chart" role="img" aria-label="Cumulative gross and net profit in RMB during the selected period"></svg>${empty?'<div class="chart-empty"><strong>Your first sale starts the chart.</strong><p>Record a sale and its direct cost.</p><button class="button primary" data-entry="sale">Add sale</button></div>':''}<div id="chart-tip" class="chart-tip" hidden></div></div><div class="chart-caption"><span>Cumulative profit · RMB</span><span>${empty?'No entries in this period':'22 Oct – 12 Nov'}</span></div></div></section><aside><div class="targets-heading"><h2 class="section-title">Your targets</h2><button class="link" data-page="targets">View all ↗</button></div><div class="goal-stack">${targetInfo.map(g=>goal(g)).join('')}</div></aside></div><section class="recent"><div class="section-heading"><h2 class="section-title">Recent entries</h2><button class="link" data-page="entries">View entries ↗</button></div>${table(3)}</section><div class="page-footer"><span>RMB is the source currency. USD and KSh are approximate equivalents.</span><span>pesabuana</span></div>`}
function entries(){const t=totals();return pageHeading('Entries','Sales and expenses, in one place.',entryActions())+`<div class="entries-summary">${[['Sales','sales'],['Direct costs','costs'],['Net profit','net']].map(([label,key])=>`<div><div class="metric-label">${label}</div><div class="metric-value">${rmb(t[key])}</div></div>`).join('')}</div><div class="entries-toolbar"><div class="filter-tabs" aria-label="Entry filter">${[['all','All entries'],['sale','Sales'],['expense','Expenses']].map(([value,label])=>`<button data-filter="${value}" aria-pressed="${entryFilter===value}">${label}</button>`).join('')}</div><span class="subtitle">${empty?'No entries':'22 Oct – 12 Nov 2026'} · RMB</span></div>${table()}<p class="explanation">Enter each sale once. Include its direct cost with the sale, and record other business expenses separately.</p>`}
function targets(){return pageHeading('Targets','Your profit, measured against a date.','<button class="button primary" data-new-target="true"><span class="plus" aria-hidden="true">+</span>Add target</button>')+`<div class="targets-grid">${targetInfo.map(g=>goal(g,true)).join('')}</div><p class="explanation">Each target uses its own dates. The same profit can count toward both targets. Estimates use the average since the start date, including days without entries.</p>`}
function settings(){return pageHeading('Settings','Currency, backups, and your local records.','')+`<div class="settings-layout"><aside class="settings-aside"><strong>Exchange rates</strong><br>Backups<br>Storage</aside><section><form id="rates-form" class="settings-card"><h2>Exchange rates</h2><p>Only the displayed equivalents change. Your records stay in RMB.</p><div class="rate-row">${['USD','KSh'].map(unit=>`<label class="field">${unit}<span class="rate-equation">1 RMB = <input name="${unit}" type="number" step="any" min="0.00000001" required value="${rates[unit]??''}" aria-label="${unit} per RMB"> ${unit}</span></label>`).join('')}</div><div class="settings-bottom"><small id="rates-updated">Last changed ${empty?'22 Oct':'12 Nov'} 2026 · Manual rates</small><button class="button primary" type="submit">Save changes</button></div></form><section class="settings-card"><h2>Backups</h2><p>A backup includes your entries, targets, and exchange rates.</p><div class="actions"><button class="button" data-backup="true">Back up data</button><button class="link" data-restore="true">Restore backup ↗</button></div></section><section class="settings-card"><h2>Local records</h2><p>${empty?'0 sales · 0 expenses':'4 sales · 3 expenses'} · 2 targets</p><div class="storage-path">C:\\Users\\Sage\\AppData\\Roaming\\pesabuana\\pesabuana.sqlite</div></section></section></div>`}
function drawChart(){const svg=root.querySelector('#profit-chart');if(!svg)return;const width=svg.parentElement.clientWidth,height=226,pad={l:47,r:11,t:10,b:26},w=width-pad.l-pad.r,h=height-pad.t-pad.b;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);const t=totals(),n=22,x=i=>pad.l+i/(n-1)*w,max=empty?100000:100000,y=v=>pad.t+h-v/max*h;const net=[0,2200,4300,4100,7200,10100,12600,12100,15700,19200,22350,25000,28700,31100,35200,36900,41400,44200,49300,51200,55650,t.net];const gross=net.map((v,i)=>i===n-1?t.gross:v*(t.gross/Math.max(1,t.net)));let out='';for(const tick of[0,25000,50000,75000,100000])out+=`<line x1="${pad.l}" y1="${y(tick)}" x2="${width-pad.r}" y2="${y(tick)}" stroke="#EDEDEB" stroke-width="1"/><text x="${pad.l-10}" y="${y(tick)+3}" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#676C76">${tick===0?'0':tick/1000+'k'}</text>`;for(const [i,label]of[[0,'22 Oct'],[7,'29 Oct'],[14,'5 Nov'],[21,'12 Nov']])out+=`<text x="${x(i)}" y="${height-4}" text-anchor="${i===0?'start':i===21?'end':'middle'}" font-family="Inter, sans-serif" font-size="12" fill="#676C76">${empty?({0:'1 Oct',7:'8 Oct',14:'15 Oct',21:'22 Oct'}[i]):label}</text>`;if(!empty){const path=a=>a.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');out+=`<defs><linearGradient id="net-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${getComputedStyle(root).getPropertyValue('--accent')}" stop-opacity=".08"/><stop offset="1" stop-color="${getComputedStyle(root).getPropertyValue('--accent')}" stop-opacity="0"/></linearGradient></defs><path d="${path(net)} L${x(21)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#net-fill)"/><path d="${path(gross)}" fill="none" stroke="#687386" stroke-width="1.6" stroke-dasharray="4 4"/><path d="${path(net)}" fill="none" stroke="${getComputedStyle(root).getPropertyValue('--accent')}" stroke-width="2.3" stroke-linejoin="round"/><circle cx="${x(21)}" cy="${y(net[21])}" r="3.5" fill="${getComputedStyle(root).getPropertyValue('--accent')}" stroke="white" stroke-width="2"/>`}
svg.innerHTML=out;const tip=root.querySelector('#chart-tip');svg.onpointermove=e=>{if(empty)return;const bounds=svg.getBoundingClientRect(),index=Math.max(0,Math.min(21,Math.round(((e.clientX-bounds.left-pad.l)/w)*21)));const d=new Date(2026,9,22+index);tip.innerHTML=`${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}<br>Gross ${rmb(gross[index])}<br>Net ${rmb(net[index])}`;tip.hidden=false};svg.onpointerleave=()=>tip.hidden=true}
function notify(message){const el=root.querySelector('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4200)}
function render(){root.querySelectorAll('.navigation button').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});main.innerHTML=({overview,entries,targets,settings}[page]||overview)();drawChart();bind()}
function openEntry(type,index){kind=type;const row=Number.isInteger(index)?fixtures[index]:null,dialog=root.querySelector('#entry-dialog');dialog.innerHTML=`<form id="entry-form"><div class="dialog-header"><h2 id="entry-heading">${row?'Edit': 'Add'} ${type}</h2><button type="button" class="close" data-close="entry-dialog" aria-label="Close">×</button></div><div class="dialog-body"><div class="form-stack"><label class="field">Date<input type="date" name="date" value="${row?row.date:empty?'2026-10-22':'2026-11-12'}" required></label><label class="field">Description<input name="description" required maxlength="120" placeholder="${type==='sale'?'Order or daily sales total':'What was this expense for?'}" value="${row?escapeHtml(row.description):''}"></label><div class="${type==='sale'?'form-row':''}"><label class="field">${type==='sale'?'Sale amount':'Amount'} (RMB)<input name="amount" type="number" step="0.01" min="0" required placeholder="0.00" value="${row?row.amount:''}"></label>${type==='sale'?`<label class="field">Direct cost (RMB)<input name="cost" type="number" step="0.01" min="0" required placeholder="0.00" value="${row?row.cost:''}"></label>`:''}</div><div class="form-section-note">${type==='sale'?'Gross profit preview':'This expense reduces net profit.'}${type==='sale'?'<strong id="profit-preview">￥0.00</strong>':''}</div><div class="form-error" id="entry-error" role="alert" hidden></div></div></div><div class="dialog-footer"><button class="button" type="button" data-close="entry-dialog">Cancel</button><button class="button primary" type="submit">${row?'Save changes':'Save '+type}</button></div></form>`;dialog.showModal();dialog.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dialog.close());const form=dialog.querySelector('form');form.oninput=()=>{const out=dialog.querySelector('#profit-preview');if(out)out.textContent=rmb(Number(form.elements.amount.value||0)-Number(form.elements.cost.value||0))};form.onsubmit=e=>{e.preventDefault();const description=form.elements.description.value.trim();if(!description){const err=dialog.querySelector('#entry-error');err.textContent='Enter a description.';err.hidden=false;return}const amount=Number(form.elements.amount.value),cost=type==='sale'?Number(form.elements.cost.value):0;const value={date:form.elements.date.value,description,type,amount,cost};if(empty)fixtures=[];if(row)fixtures[index]=value;else fixtures.unshift(value);empty=false;root.querySelector('#empty-toggle').checked=false;dialog.close();render();notify('Saved in this preview only. Your actual app records were not changed.')};form.dispatchEvent(new Event('input'))}
function openDetails(id){const g=targetInfo.find(g=>g.id===id),dialog=root.querySelector('#details-dialog'),net=totals().net,days=empty?g.emptyDays:g.days;dialog.innerHTML=`<div class="dialog-header"><h2 id="details-heading">${g.name}</h2><button class="close" data-close="details-dialog" aria-label="Close">×</button></div><div class="dialog-body"><dl class="details-list"><dt>Target</dt><dd>${rmb(g.amount)}</dd><dt>Net profit earned</dt><dd>${rmb(net)}</dd><dt>Progress</dt><dd>${(net/g.amount*100).toFixed(2)}%</dd><dt>Amount remaining</dt><dd>${rmb(Math.max(0,g.amount-net))}</dd><dt>Period</dt><dd>22 Oct – ${g.deadline}</dd><dt>Days left</dt><dd>${days}, including today</dd><dt>Needed per day</dt><dd>${rmb(Math.max(0,g.amount-net)/days)}</dd><dt>Estimate at deadline</dt><dd>${rmb(empty?0:net/22*(g.id==='birthday'?44:71))}</dd></dl><p class="details-note">Estimate uses the average since the start date, including days without entries. Sample figures demonstrate the layout only.</p></div><div class="dialog-footer"><button class="button" data-close="details-dialog">Close</button></div>`;dialog.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dialog.close());dialog.showModal()}
function bind(){main.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});main.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));main.querySelectorAll('[data-edit-entry]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.editEntry);openEntry(fixtures[i].type,i)});main.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{entryFilter=b.dataset.filter;render()});main.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>openDetails(b.dataset.goal));main.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>notify('The production app keeps its existing period filters. This reference uses a fixed sample period.'));main.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{page='settings';render()});main.querySelectorAll('[data-new-target],[data-edit-target],[data-delete-target]').forEach(b=>b.onclick=()=>notify('Design reference only. Keep the working target editor and delete confirmation in the installed app.'));main.querySelectorAll('[data-backup],[data-restore]').forEach(b=>b.onclick=()=>notify('Design reference only. Your actual records and backups are not accessed here.'));const form=main.querySelector('#rates-form');if(form)form.onsubmit=e=>{e.preventDefault();rates={USD:Number(form.elements.USD.value),KSh:Number(form.elements.KSh.value)};if(!Object.values(rates).every(v=>Number.isFinite(v)&&v>0))return;notify('Preview rates updated. Your installed app is unchanged.');main.querySelector('#rates-updated').textContent='Saved in this preview session only.'}}
root.querySelectorAll('.navigation button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});root.querySelector('#empty-toggle').checked=empty;root.querySelector('#empty-toggle').onchange=e=>{empty=e.target.checked;render()};root.querySelector('#accent-picker').onchange=e=>{const blue=e.target.value==='blue';root.style.setProperty('--accent',blue?'#315ECE':'#C44832');root.style.setProperty('--accent-hover',blue?'#2549A6':'#A63B29');root.style.setProperty('--tint',blue?'#EDF2FF':'#FEF1ED');drawChart()};if(params.get('clean')==='1')root.querySelector('#demo-toolbar').hidden=true;render();new ResizeObserver(()=>drawChart()).observe(main);window.__pesabuanaReference={render,totals,openEntry,setPage:p=>{page=p;render()},setEmpty:v=>{empty=v;root.querySelector('#empty-toggle').checked=v;render()}};
})();
</script>
